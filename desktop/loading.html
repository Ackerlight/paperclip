<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Paperclip</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #18181b; --muted: #71717a; --line: #e4e4e7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0b; --fg: #f4f4f5; --muted: #a1a1aa; --line: #27272a; } }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid; place-items: center; -webkit-app-region: drag;
  }
  .box { text-align: center; max-width: 520px; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0; }
  .bar { width: 180px; height: 3px; margin: 22px auto 0; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--fg); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  pre { text-align: left; font-size: 11px; color: var(--muted); white-space: pre-wrap; max-height: 40vh; overflow: auto; -webkit-app-region: no-drag; }
  .error .bar { display: none; }
</style>
</head>
<body>
<div class="box" id="box">
  <h1 id="title">Starting Paperclip</h1>
  <p id="status">Starting the local server and database…</p>
  <div class="bar"></div>
  <pre id="detail"></pre>
</div>
<script>
  // main.cjs fills these in with executeJavaScript while the server boots.
  window.setStatus = (title, status, detail, isError) => {
    document.getElementById("title").textContent = title;
    document.getElementById("status").textContent = status;
    document.getElementById("detail").textContent = detail || "";
    document.getElementById("box").classList.toggle("error", Boolean(isError));
  };
</script>
</body>
</html>
